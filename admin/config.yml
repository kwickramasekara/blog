backend:
  name: git-gateway
  branch: main
  squash_merges: true
local_backend: true
publish_mode: editorial_workflow
site_url: https://blog.keithw.me
media_library:
  name: cloudinary
  use_transformations: false
  config:
    cloud_name: ylsrp85w
    api_key: "877774134499476"
    folder:
      path: blog
collections:
  - name: "posts" # Used in routes, e.g., /admin/collections/blog
    label: "Posts" # Used in the UI
    label_singular: "Post" # Used in the UI for one instance of the collection
    folder: "src/posts" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
    preview_path: "{{slug}}" # For Editorial workflow preview links in the editor
    fields: # The fields for each document, usually in front matter
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - label: "Tag"
        name: "tags"
        widget: "select"
        options:
          - { label: "Finance", value: "finance" }
          - { label: "Lifestyle", value: "lifestyle" }
          - { label: "Miscellaneous", value: "miscellaneous" }
          - { label: "Photography", value: "photography" }
          - { label: "Technology", value: "technology" }
          - { label: "Travel", value: "travel" }
      - {
          label: "Share card image",
          name: "shareCardImage",
          widget: "string",
          required: false,
          hint: "Select a Cloudinary image. It is delivered with c_limit,w_640,h_640/f_auto/q_auto at build time.",
        }
      - { label: "Body", name: "body", widget: "markdown" }
